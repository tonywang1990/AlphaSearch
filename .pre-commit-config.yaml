repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: file-size
        name: Python files at most 700 lines
        entry: uv run --no-sync pytest -q tests/test_layers.py::test_file_size_cap
        language: system
        types: [python]
        pass_filenames: false
